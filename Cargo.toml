[workspace]
resolver = "2"
members = [
    "crates/daw-core",
    "crates/daw-project",
    "crates/daw-dsp",
    "crates/daw-engine",
    "crates/daw-render",
    "crates/daw-media",
    "crates/daw-commands",
    "crates/daw-audio-io",
    "crates/daw-app",
]

# Shared metadata and dependency versions for all workspace crates.
# Internal crate names use a neutral `daw-*` prefix so the working product
# name ("Free Sound") is never hard-coded into core architecture.
[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/csanyilevente8/freesound-project"
authors = []

[workspace.dependencies]
# Pinned, well-known, actively-maintained dependencies. See the dependency
# inventory in docs/architecture/overview.md for rationale and licensing.
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
thiserror = "1.0.64"
# Real-time audio I/O and lock-free queue (ADR-0003, ADR-0007). First
# third-party audio dependencies; both MIT/Apache-2.0.
cpal = "0.18.2"
rtrb = "0.4.0"
# GUI (ADR-0002, egui — pending prototype). Optional, behind the `gui` feature
# of daw-app so headless builds/CI never pull windowing/GPU deps.
eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"

# Internal crates
daw-core = { path = "crates/daw-core" }
daw-project = { path = "crates/daw-project" }
daw-dsp = { path = "crates/daw-dsp" }
daw-engine = { path = "crates/daw-engine" }
daw-render = { path = "crates/daw-render" }
daw-media = { path = "crates/daw-media" }
daw-commands = { path = "crates/daw-commands" }
daw-audio-io = { path = "crates/daw-audio-io" }

[profile.release]
opt-level = 3
lto = "thin"
