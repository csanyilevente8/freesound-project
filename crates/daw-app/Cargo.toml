[package]
name = "daw-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Application composition and the minimal UI shell entry point. The GUI framework is intentionally not yet selected (ADR-0002 open); this shell renders project state to stdout behind an app-facing boundary so a graphical frontend can replace it without touching core crates."

[[bin]]
name = "daw"
path = "src/main.rs"

# Graphical prototype (ADR-0002). Only built with `--features gui` so the
# default/headless build and CI never require a display or GPU.
[[bin]]
name = "daw-gui"
path = "src/bin/daw_gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
daw-core.workspace = true
daw-project.workspace = true
daw-engine.workspace = true
daw-render.workspace = true
daw-media.workspace = true
daw-audio-io.workspace = true
daw-commands.workspace = true
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.13.0"
